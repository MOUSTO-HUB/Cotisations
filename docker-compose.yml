services:
  db:
    image: postgres:16-alpine
    container_name: cotisations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cotisations
      POSTGRES_PASSWORD: cotisations
      POSTGRES_DB: cotisations
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
